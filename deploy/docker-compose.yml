services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge
      POSTGRES_DB: relayforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
      dockerfile: src/TaskScheduler.Api/Dockerfile
    ports:
      - "5053:8080"
    environment:
      ConnectionStrings__Scheduler: Host=postgres;Port=5432;Database=relayforge;Username=relayforge;Password=relayforge
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379
      Scheduler__Database: Postgres
      Scheduler__Queue: RabbitMq
      Scheduler__LockProvider: Redis
      Scheduler__RunInProcessWorkers: "false"
      Scheduler__WorkerCount: "4"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../backend
      dockerfile: src/TaskScheduler.Worker/Dockerfile
    environment:
      ConnectionStrings__Scheduler: Host=postgres;Port=5432;Database=relayforge;Username=relayforge;Password=relayforge
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379
      Scheduler__Database: Postgres
      Scheduler__Queue: RabbitMq
      Scheduler__LockProvider: Redis
      Scheduler__WorkerCount: "4"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      api:
        condition: service_started

  worker2:
    build:
      context: ../backend
      dockerfile: src/TaskScheduler.Worker/Dockerfile
    environment:
      ConnectionStrings__Scheduler: Host=postgres;Port=5432;Database=relayforge;Username=relayforge;Password=relayforge
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      ConnectionStrings__Redis: redis:6379
      Scheduler__Database: Postgres
      Scheduler__Queue: RabbitMq
      Scheduler__LockProvider: Redis
      Scheduler__WorkerCount: "4"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      api:
        condition: service_started

  # Next.js dashboard (primary frontend). Runs in the browser, so it talks to the
  # API through the host-published port.
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5053
    ports:
      - "3001:3000"
    depends_on:
      - api

  # Blazor dashboard from Phase 5, kept as the server-rendered counterpart.
  dashboard:
    build:
      context: ../backend
      dockerfile: src/TaskScheduler.Dashboard/Dockerfile
    ports:
      - "5081:8080"
    environment:
      ApiBaseUrl: http://api:8080
      PublicApiBaseUrl: http://localhost:5053
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
